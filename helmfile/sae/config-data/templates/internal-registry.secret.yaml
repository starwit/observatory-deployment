{{- with .Values.internalRegistryPullSecret }}
{{- $auth := printf "%s:%s" (required "internalRegistryPullSecret.username is required" .username) (required "internalRegistryPullSecret.password is required" .password) | b64enc }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict .registry (dict "username" .username "password" .password "auth" $auth)) | toJson | b64enc }}
{{- end }}
